<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
<!-- Aogiri app icon for Windows and Linux: the rounded square fills the canvas
     (those systems add no mask and no margin of their own). Becomes
     src-tauri/icons/icon.ico and the PNGs there, and static/favicon.png. -->
<defs>
  <radialGradient id="bg" cx="50%" cy="56%" r="72%"><stop offset="0" stop-color="#2B1D12"/><stop offset="0.55" stop-color="#15110D"/><stop offset="1" stop-color="#0B0A09"/></radialGradient>
  <radialGradient id="halo" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#F0A465" stop-opacity="0.34"/><stop offset="0.74" stop-color="#F0A465" stop-opacity="0.26"/><stop offset="0.87" stop-color="#F0A465" stop-opacity="0.09"/><stop offset="1" stop-color="#F0A465" stop-opacity="0"/></radialGradient>
  <radialGradient id="body" cx="50%" cy="42%" r="62%" fx="44%" fy="34%"><stop offset="0" stop-color="#F0A465"/><stop offset="0.6" stop-color="#F0A465"/><stop offset="1" stop-color="#D46E3E"/></radialGradient>
  <radialGradient id="core" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#FFE3BC" stop-opacity="0.95"/><stop offset="0.45" stop-color="#FFE3BC" stop-opacity="0.55"/><stop offset="1" stop-color="#FFE3BC" stop-opacity="0"/></radialGradient>
  <clipPath id="ember"><path d="M55 1C59 10 67 17 77 27C88 38 94 51 93 66C92 86 73 100 50 100C27 100 7 86 7 66C7 53 13 43 21 35C23 43 28 49 35 51C32 37 38 17 55 1Z"/></clipPath>
  <clipPath id="tile"><rect width="1024" height="1024" rx="230"/></clipPath>
  <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFE3BC" stop-opacity="0.22"/><stop offset="0.45" stop-color="#FFE3BC" stop-opacity="0.04"/><stop offset="1" stop-color="#FFE3BC" stop-opacity="0"/></linearGradient>
</defs>
<g clip-path="url(#tile)">
  <!-- the full-bleed drawing (aogiri-icon.svg) -->
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <circle cx="512" cy="561.6" r="351" fill="url(#halo)"/>
  <g transform="translate(252,257.4) scale(5.2)">
    <path d="M55 1C59 10 67 17 77 27C88 38 94 51 93 66C92 86 73 100 50 100C27 100 7 86 7 66C7 53 13 43 21 35C23 43 28 49 35 51C32 37 38 17 55 1Z" fill="url(#body)"/>
    <circle cx="41" cy="40" r="26" fill="url(#core)" clip-path="url(#ember)"/>
    <rect x="36" y="60" width="7" height="14" rx="3.5" fill="#FFFBF4"/>
    <rect x="57" y="60" width="7" height="14" rx="3.5" fill="#FFFBF4"/>
  </g>
</g>
<rect x="1.5" y="1.5" width="1021" height="1021" rx="228.5" fill="none" stroke="url(#edge)" stroke-width="3"/>
</svg>
