name: Release

# Build and publish a GitHub Release with installers for macOS, Linux and
# Windows whenever a version tag is pushed. Manual runs build without
# publishing unless an existing release tag is supplied for recovery.
# The draft job makes the one release for the tag; every build leg uploads
# to it and publish refuses a tag with more than one release.
#
# Repo secrets used:
#   TAURI_SIGNING_PRIVATE_KEY(_PASSWORD) — updater artifact signing (required
#     for auto-update; the matching pubkey lives in tauri.conf.json).
#   LYNSHEN_CLI_TOKEN — optional clone token; the public CLI repo defaults
#     to github.token (desktop + pinned sidecar engine update together).
#   APPLE_CERTIFICATE(_PASSWORD) — optional; macOS keeps granted permissions
#     across updates only while the signing identity stays the same.
on:
  push:
    tags:
      - 'v*'
      - '[0-9]*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to finish (leave empty for a build only)
        type: string
        default: ''
      macos_only:
        description: Rebuild only macOS artifacts for an existing release
        type: boolean
        default: false
      macos_arch:
        description: Architecture for a macOS-only recovery
        type: choice
        options: [both, arm, intel]
        default: both

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ inputs.release_tag || (github.event_name == 'push' && github.ref_name) || '' }}

jobs:
  # tauri-action creates a release when its lookup by tag finds none, and each
  # build leg looks on its own: legs that reach the upload together each create
  # a draft (v0.10.2 got two drafts, each with half the files and its own
  # latest.json). This job is the only place that creates the release.
  draft:
    name: Create or find the release
    runs-on: ubuntu-latest
    # Two runs for one tag must not both create a draft.
    concurrency:
      group: release-draft-${{ inputs.release_tag || (github.event_name == 'push' && github.ref_name) || github.run_id }}
    outputs:
      release_id: ${{ steps.draft.outputs.release_id }}
    steps:
      - uses: actions/checkout@v4
        if: env.RELEASE_TAG != ''
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      # A manual build without a tag skips this: release_id stays empty and
      # the legs upload nothing.
      - name: Create or find the one release for the tag
        id: draft
        if: env.RELEASE_TAG != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/check-release-version.mjs "$RELEASE_TAG"
          version=$(node -p "require('./package.json').version")
          notes="release-notes/$version.md"
          test -s "$notes" || { echo "missing $notes"; exit 1; }
          # The list includes drafts; a lookup by tag does not.
          ids=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[] | select(.tag_name == env.RELEASE_TAG) | .id')
          count=$(grep -c . <<< "$ids" || true)
          if [ "$count" -eq 0 ]; then
            # The body is the notes file without its final newline, as the
            # notes step below passes it to tauri-action.
            id=$(jq -n --arg tag "$RELEASE_TAG" --arg sha "$(git rev-parse HEAD)" --rawfile body "$notes" \
              '{tag_name: $tag, name: $tag, body: ($body | rtrimstr("\n")), draft: true, prerelease: false, target_commitish: $sha}' |
              gh api "repos/$GITHUB_REPOSITORY/releases" --input - --jq .id)
            echo "Created draft release $id for $RELEASE_TAG"
          elif [ "$count" -eq 1 ]; then
            id=$ids
            echo "Using the existing release $id for $RELEASE_TAG"
          else
            echo "::error::$count releases exist for $RELEASE_TAG ($(echo $ids)). Keep one, delete the others, then run again."
            exit 1
          fi
          test -n "$id"
          echo "release_id=$id" >> "$GITHUB_OUTPUT"

  release:
    needs: draft
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.macos_only && (inputs.macos_arch == 'intel' && '[{"os":"macos-15-intel","target":"x86_64-apple-darwin"}]' || inputs.macos_arch == 'arm' && '[{"os":"macos-15","target":"aarch64-apple-darwin"}]' || '[{"os":"macos-15","target":"aarch64-apple-darwin"},{"os":"macos-15-intel","target":"x86_64-apple-darwin"}]') || '[{"os":"macos-15","target":"aarch64-apple-darwin"},{"os":"macos-15-intel","target":"x86_64-apple-darwin"},{"os":"ubuntu-22.04","target":"x86_64-unknown-linux-gnu"},{"os":"windows-latest","target":"x86_64-pc-windows-msvc"}]') }}
    runs-on: ${{ matrix.os }}
    env:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev \
            build-essential file libssl-dev

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true

      - run: pnpm install --frozen-lockfile

      - name: Validate release inputs
        shell: bash
        env:
          SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          test -n "$SIGNING_KEY" || { echo 'TAURI_SIGNING_PRIVATE_KEY is required'; exit 1; }
          node scripts/check-release-version.mjs "$RELEASE_TAG"
          echo "CLI_REF=$(tr -d '\r\n' < src-tauri/lynshen-cli.ref)" >> "$GITHUB_ENV"
      - run: pnpm check
      - run: pnpm test --testTimeout=15000
      - run: node --test scripts/prepare-desktop-release.test.mjs
      # The receiver runs on the Linux server and imports fcntl, which Windows lacks.
      - if: runner.os != 'Windows'
        run: python3 scripts/test-receive-desktop-release.py

      - name: Check out the pinned CLI engine
        uses: actions/checkout@v4
        with:
          repository: Libra1337/LynShen-CLI
          ref: ${{ env.CLI_REF }}
          token: ${{ secrets.LYNSHEN_CLI_TOKEN || github.token }}
          path: .release-cli
          submodules: recursive

      # The app ships the LynShen CLI engine as a sidecar (see
      # src-tauri/src/app_cli.rs and tauri.bundle.conf.json), so a desktop
      # update carries the matching engine: the two stay in sync.
      - name: Build the LynShen CLI sidecar
        shell: bash
        run: |
          cd .release-cli
          expected=$(tr -d '\r\n' < ../src-tauri/lynshen-cli.version)
          actual=$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "lynshen-cli"))')
          test "$actual" = "$expected"
          cargo build --locked --release --target "${{ matrix.target }}"
          ext=""; [ "${{ matrix.target }}" = "x86_64-pc-windows-msvc" ] && ext=".exe"
          cd "$GITHUB_WORKSPACE"
          mkdir -p src-tauri/binaries
          cp ".release-cli/target/${{ matrix.target }}/release/lynshen${ext}" "src-tauri/binaries/lynshen-cli-${{ matrix.target }}${ext}"
          node scripts/third-party-notices.mjs --cargo .release-cli/Cargo.toml --extra .release-cli/docs/third-party/android-use.txt --title 'LynShen CLI: third-party software' --out static/lynshen-cli-third-party-notices.txt

      # macOS builds sign with a fixed self-signed certificate (not
      # notarized) when the secret is configured; otherwise use ad-hoc signing.
      - name: Import the macOS signing certificate
        if: runner.os == 'macOS' && env.APPLE_CERTIFICATE != ''
        env:
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(openssl rand -hex 16)"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/signing.p12" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          sudo security add-trusted-cert -d -r trustRoot -p codeSign -k /Library/Keychains/System.keychain src-tauri/macos-signing-cert.pem
          security find-identity -v -p codesigning "$keychain"
          rm "$RUNNER_TEMP/signing.p12"

      - name: Verify the desktop before publication
        shell: bash
        run: |
          pnpm build
          cargo test --manifest-path src-tauri/Cargo.toml
          cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings

      # Every release says what changed: release-notes/<version>.md (Chinese
      # 更新公告) becomes the release body, which also lands in latest.json as
      # the notes the update prompt shows.
      - name: Read the release notes
        id: notes
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          file="release-notes/$version.md"
          test -s "$file" || { echo "missing $file"; exit 1; }
          {
            echo 'body<<LYNSHEN_NOTES_EOF'
            cat "$file"
            echo 'LYNSHEN_NOTES_EOF'
          } >> "$GITHUB_OUTPUT"

      # tauri-action runs beforeBuildCommand (pnpm build), bundles the app with
      # the lynshen sidecar and uploads the installers to the release from the
      # draft job. With TAURI_SIGNING_PRIVATE_KEY set it additionally signs the
      # updater bundles (.sig) and adds this leg's platforms to the release's
      # latest.json, which installed clients poll (plugins.updater in
      # tauri.conf.json).
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ (runner.os == 'macOS' && env.APPLE_CERTIFICATE != '') && 'LynShen Self-Signed' || '-' }}
        with:
          # A manual run publishes only when it explicitly targets an existing
          # tag. With releaseId set tauri-action creates no release (and
          # without releaseName it cannot); tagName only sets the download
          # URLs in latest.json, and releaseBody its notes.
          releaseId: ${{ needs.draft.outputs.release_id }}
          tagName: ${{ env.RELEASE_TAG }}
          args: --target ${{ matrix.target }} --config src-tauri/tauri.bundle.conf.json
          releaseBody: ${{ steps.notes.outputs.body }}

      - name: Keep the manual build
        if: github.event_name == 'workflow_dispatch' && env.RELEASE_TAG == ''
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.target }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/

  publish:
    needs: [draft, release]
    if: github.event_name == 'push' || inputs.release_tag != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # gh release download takes the first release it finds for the tag, so a
      # second release would publish half the files.
      - name: Check that the tag has one release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.draft.outputs.release_id }}
        run: |
          releases=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[] | select(.tag_name == env.RELEASE_TAG) | "\(.id) draft=\(.draft) assets=\(.assets | length) created=\(.created_at)"')
          count=$(grep -c . <<< "$releases" || true)
          if [ "$count" -gt 1 ]; then
            echo "::error::$count releases exist for $RELEASE_TAG; publishing needs exactly one. Keep release $RELEASE_ID (the build legs uploaded to it): move any missing files into it, merge the latest.json files, delete the other releases, then rerun this job."
            echo "$releases"
            exit 1
          fi
          test "$count" -eq 1 || { echo "::error::No release exists for $RELEASE_TAG."; exit 1; }
          echo "$releases"
      - name: Download the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$RELEASE_TAG" --dir release-assets
      # Each leg merges its platforms into latest.json by download, edit and
      # upload, with no lock: a leg that writes at the same time as another
      # can drop that leg's platforms. prepare-desktop-release.mjs requires
      # only Windows and the two macOS platforms, so check every leg here.
      - name: Check that latest.json lists every platform
        shell: bash
        run: |
          # The platform keys each leg writes, by the leg's runner.
          expected='{
            "macos-15": ["darwin-aarch64", "darwin-aarch64-app"],
            "macos-15-intel": ["darwin-x86_64", "darwin-x86_64-app"],
            "ubuntu-22.04": ["linux-x86_64", "linux-x86_64-appimage", "linux-x86_64-deb", "linux-x86_64-rpm"],
            "windows-latest": ["windows-x86_64", "windows-x86_64-msi", "windows-x86_64-nsis"]
          }'
          legs=$(jq -r --argjson expected "$expected" \
            '.platforms as $have | $expected | to_entries[] | select(any(.value[]; $have[.] == null)) | .key' \
            release-assets/latest.json)
          if [ -n "$legs" ]; then
            missing=$(jq -r --argjson expected "$expected" \
              '.platforms as $have | [$expected[][] | select($have[.] == null)] | join(" ")' release-assets/latest.json)
            echo "::error::latest.json of $RELEASE_TAG lacks $missing. Rerun the build leg(s) $(echo $legs) of this run (each adds its platforms to the same latest.json), then rerun this job."
            exit 1
          fi
          echo "latest.json lists all $(jq '.platforms | length' release-assets/latest.json) platforms"
      - name: Validate the complete release and prepare the Monoize mirror
        env:
          PUBLIC_ORIGIN: ${{ vars.DESKTOP_PUBLIC_ORIGIN || 'https://www.lynshen.org' }}
        run: node scripts/prepare-desktop-release.mjs release-assets distribution "$PUBLIC_ORIGIN"
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-distribution
          path: distribution/
      - name: Publish the complete GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$RELEASE_TAG" --draft=false --latest
      - name: Publish downloads and updates on Monoize
        if: vars.DESKTOP_SSH_HOST != ''
        env:
          DESKTOP_SSH_HOST: ${{ vars.DESKTOP_SSH_HOST }}
          DESKTOP_SSH_USER: ${{ vars.DESKTOP_SSH_USER }}
          DESKTOP_SSH_KEY: ${{ secrets.DESKTOP_SSH_KEY }}
          DESKTOP_SSH_KNOWN_HOSTS: ${{ secrets.DESKTOP_SSH_KNOWN_HOSTS }}
        run: bash scripts/publish-desktop-release.sh
