name: Rename upgrade

# The product was called LynShen up to 0.5.x. This builds the installers from
# the branch and runs them over the released LynShen 0.5.0, the way the updater
# does, on throwaway runners. What it checks is in
# scripts/windows-rename-upgrade-check.ps1 and scripts/linux-rename-upgrade-check.sh;
# the reasoning is in docs/rename-aogiri-notes.md.
#
# Run it by hand before the first release under the new name, and again after
# any change to src-tauri/windows/hooks.nsh or the bundle configuration.
on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

concurrency:
  group: rename-upgrade-${{ github.ref }}
  cancel-in-progress: true

env:
  OLD_TAG: v0.5.0
  OLD_VERSION: 0.5.0
  # The installers under test carry a higher version than the one they replace,
  # as a real update does. They are test builds: nothing here is published.
  NEW_VERSION: 0.5.1

jobs:
  windows:
    name: Windows (setup.exe and MSI over LynShen 0.5.0)
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'feat/rename-aogiri'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true
      - run: pnpm install --frozen-lockfile

      # A release ships the engine as a sidecar (tauri.bundle.conf.json), so the
      # installers lay out the same files as a release. The engine itself is
      # not under test: a small system program stands in for it.
      - name: Stand in for the engine sidecar
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force src-tauri/binaries | Out-Null
          Copy-Item "$env:SystemRoot\System32\whoami.exe" src-tauri/binaries/lynshen-cli-x86_64-pc-windows-msvc.exe

      - name: Build the installers from this branch
        shell: pwsh
        run: |
          $override = @{ version = $env:NEW_VERSION; bundle = @{ createUpdaterArtifacts = $false; targets = @('nsis', 'msi') } }
          $override | ConvertTo-Json -Depth 5 | Set-Content rename-test.conf.json
          pnpm tauri build --config src-tauri/tauri.bundle.conf.json --config rename-test.conf.json
          Get-ChildItem src-tauri/target/release/bundle -Recurse -File | ForEach-Object { $_.FullName }

      - name: Download the released LynShen 0.5.0 installers
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download $env:OLD_TAG --repo Libra1337/LynShen_Agent --dir old `
            --pattern "LynShen_${env:OLD_VERSION}_x64-setup.exe" --pattern "LynShen_${env:OLD_VERSION}_x64_en-US.msi"
          # The setup.exe is the file the download page offers (catalog.json).
          $expected = '9a9ade718380262a7dd67a89b3c5606061c40790472cf827526b030ebf86b351'
          $actual = (Get-FileHash "old/LynShen_${env:OLD_VERSION}_x64-setup.exe" -Algorithm SHA256).Hash.ToLower()
          if ($actual -ne $expected) { throw "Unexpected setup.exe: $actual" }
          Get-ChildItem old | ForEach-Object { "$($_.Name)  $((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())" }

      - name: Install LynShen 0.5.0, then update it as the updater does
        shell: pwsh
        run: |
          $bundle = 'src-tauri/target/release/bundle'
          ./scripts/windows-rename-upgrade-check.ps1 `
            -OldSetup "old/LynShen_${env:OLD_VERSION}_x64-setup.exe" `
            -NewSetup "$bundle/nsis/Aogiri_${env:NEW_VERSION}_x64-setup.exe" `
            -OldMsi "old/LynShen_${env:OLD_VERSION}_x64_en-US.msi" `
            -NewMsi "$bundle/msi/Aogiri_${env:NEW_VERSION}_x64_en-US.msi" `
            -NewVersion $env:NEW_VERSION

      - name: Keep the test installers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rename-test-installers-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          retention-days: 7
          if-no-files-found: ignore

  linux:
    name: Linux (deb and rpm over LynShen 0.5.0)
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'feat/rename-aogiri'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev \
            build-essential file libssl-dev
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true
      - run: pnpm install --frozen-lockfile

      - name: Stand in for the engine sidecar
        run: |
          mkdir -p src-tauri/binaries
          cp /bin/true src-tauri/binaries/lynshen-cli-x86_64-unknown-linux-gnu

      - name: Build the packages from this branch
        run: |
          printf '{"version":"%s","bundle":{"createUpdaterArtifacts":false,"targets":["deb","rpm"]}}' "$NEW_VERSION" > rename-test.conf.json
          pnpm tauri build --config src-tauri/tauri.bundle.conf.json --config rename-test.conf.json
          find src-tauri/target/release/bundle -type f

      - name: Download the released LynShen 0.5.0 packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$OLD_TAG" --repo Libra1337/LynShen_Agent --dir old \
            --pattern "LynShen_${OLD_VERSION}_amd64.deb" --pattern "LynShen-${OLD_VERSION}-1.x86_64.rpm"
          # The checksums the download page publishes (catalog.json).
          sha256sum --check <<EOF
          7b335a1ffb6f9d6a7a93149f9049d77b94831c5add0abe6dd644cba9ec515e02  old/LynShen_${OLD_VERSION}_amd64.deb
          b328017e8920ea15f3cec69b880989236fa118fbfdc7848a684454ba7df219b6  old/LynShen-${OLD_VERSION}-1.x86_64.rpm
          EOF

      - name: Show what the new packages declare
        run: |
          dpkg-deb --info "src-tauri/target/release/bundle/deb/Aogiri_${NEW_VERSION}_amd64.deb"
          dpkg-deb --contents "src-tauri/target/release/bundle/deb/Aogiri_${NEW_VERSION}_amd64.deb"

      - name: 'deb: install LynShen 0.5.0, then update it as the updater does'
        run: |
          cp "src-tauri/target/release/bundle/deb/Aogiri_${NEW_VERSION}_amd64.deb" .
          cp "old/LynShen_${OLD_VERSION}_amd64.deb" .
          scripts/linux-rename-upgrade-check.sh deb "LynShen_${OLD_VERSION}_amd64.deb" "Aogiri_${NEW_VERSION}_amd64.deb"

      - name: 'rpm: the same in a Fedora container'
        run: |
          mkdir rpm-test
          cp "old/LynShen-${OLD_VERSION}-1.x86_64.rpm" "src-tauri/target/release/bundle/rpm/Aogiri-${NEW_VERSION}-1.x86_64.rpm" rpm-test/
          cp scripts/linux-rename-upgrade-check.sh rpm-test/
          docker run --rm -v "$PWD/rpm-test:/work" -w /work fedora:41 \
            bash linux-rename-upgrade-check.sh rpm "LynShen-${OLD_VERSION}-1.x86_64.rpm" "Aogiri-${NEW_VERSION}-1.x86_64.rpm"

      - name: Keep the test packages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rename-test-packages-linux
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
          retention-days: 7
          if-no-files-found: ignore
