name: Rename upgrade

# The product was called LynShen up to 0.5.x. This builds the installers and
# the app from the branch and puts them over the released LynShen 0.5.1 on
# throwaway runners, the way users get them: the setup.exe and the MSI run as
# the updater runs them, the update taken from inside the running old app
# (Windows), the bundle swapped in place as the updater does (macOS), and a
# fresh Aogiri.app beside the old one. What it checks is in
# scripts/windows-rename-upgrade-check.ps1, scripts/macos-rename-upgrade-check.sh
# and scripts/linux-rename-upgrade-check.sh; the reasoning is in
# docs/rename-aogiri-notes.md.
#
# With `new_release_tag` (e.g. v0.6.0) a manual run checks that published
# release's installers instead of building: what users actually got.
on:
  workflow_dispatch:
    inputs:
      new_release_tag:
        description: Check this published release (e.g. v0.6.0) instead of building the branch
        required: false
        default: ''
      scenarios:
        description: Only these Windows scenarios (comma-separated; default all)
        required: false
        default: ''
  pull_request:
    paths:
      - src-tauri/windows/**
      - src-tauri/src/renamed.rs
      - src-tauri/src/renamed/**
      - scripts/*rename*
      - .github/workflows/rename-upgrade.yml

permissions:
  contents: read

concurrency:
  group: rename-upgrade-${{ github.ref }}-${{ inputs.new_release_tag }}-${{ inputs.scenarios }}
  cancel-in-progress: true

env:
  OLD_TAG: v0.5.1
  OLD_VERSION: 0.5.1
  # The first release under the new name: machines that took it still have
  # LynShen leftovers the next update must clear.
  MID_TAG: v0.6.0
  MID_VERSION: 0.6.0
  NEW_TAG: ${{ inputs.new_release_tag }}
  # Test builds carry a higher version than the one they replace, as a real
  # update does. They are signed with a throwaway updater key and never
  # published.
  TEST_VERSION: 0.7.0

jobs:
  windows:
    name: Windows (setup.exe, MSI and in-app update over LynShen 0.5.1)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        if: env.NEW_TAG == ''
      - uses: Swatinem/rust-cache@v2
        if: env.NEW_TAG == ''
        with:
          workspaces: src-tauri
          cache-on-failure: true
      - run: pnpm install --frozen-lockfile
        if: env.NEW_TAG == ''

      # A release ships the engine as a sidecar (tauri.bundle.conf.json), so the
      # installers lay out the same files as a release. The engine itself is
      # not under test: a small system program stands in for it.
      - name: Stand in for the engine sidecar
        if: env.NEW_TAG == ''
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force src-tauri/binaries | Out-Null
          Copy-Item "$env:SystemRoot\System32\whoami.exe" src-tauri/binaries/lynshen-cli-x86_64-pc-windows-msvc.exe

      # The updater signatures let the old app take the update from inside;
      # the check script makes the old app trust the throwaway key.
      - name: Build the installers from this branch
        if: env.NEW_TAG == ''
        shell: pwsh
        run: |
          $key = Join-Path $env:RUNNER_TEMP 'rename-test.key'
          pnpm tauri signer generate --ci -p rename-test -w $key
          $env:TAURI_SIGNING_PRIVATE_KEY = $key
          $env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD = 'rename-test'
          $override = @{ version = $env:TEST_VERSION; bundle = @{ createUpdaterArtifacts = $true; targets = @('nsis', 'msi') } }
          $override | ConvertTo-Json -Depth 5 | Set-Content rename-test.conf.json
          pnpm tauri build --config src-tauri/tauri.bundle.conf.json --config rename-test.conf.json
          $bundle = 'src-tauri/target/release/bundle'
          New-Item -ItemType Directory -Force new | Out-Null
          Copy-Item "$bundle/nsis/Aogiri_${env:TEST_VERSION}_x64-setup.exe*", "$bundle/msi/Aogiri_${env:TEST_VERSION}_x64_en-US.msi*" new/
          Copy-Item "$key.pub" new/updater.pub
          "NEW_VERSION=$env:TEST_VERSION" >> $env:GITHUB_ENV
          Get-ChildItem new | ForEach-Object Name

      - name: Download the published release's installers
        if: env.NEW_TAG != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = $env:NEW_TAG.TrimStart('v')
          gh release download $env:NEW_TAG --repo Libra1337/LynShen_Agent --dir new `
            --pattern "Aogiri_${version}_x64-setup.exe*" --pattern "Aogiri_${version}_x64_en-US.msi*"
          "NEW_VERSION=$version" >> $env:GITHUB_ENV
          Get-ChildItem new | ForEach-Object Name

      - name: Download the released LynShen 0.5.1 and Aogiri 0.6.0 installers
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download $env:OLD_TAG --repo Libra1337/LynShen_Agent --dir old `
            --pattern "LynShen_${env:OLD_VERSION}_x64-setup.exe" --pattern "LynShen_${env:OLD_VERSION}_x64_en-US.msi"
          # What machines updated to first under the new name.
          if ($env:NEW_TAG -eq '') {
            gh release download $env:MID_TAG --repo Libra1337/LynShen_Agent --dir mid --pattern "Aogiri_${env:MID_VERSION}_x64-setup.exe"
          }
          # The files the release and the download server publish.
          $expected = @{
            "LynShen_${env:OLD_VERSION}_x64-setup.exe" = '720fb7cfbf426a4d5e82d1b1a4c4ec8a4d85165371fc291fb961d4ce47470635'
            "LynShen_${env:OLD_VERSION}_x64_en-US.msi" = '4dc2c4be3d9773fb14e2376858b801fb659ffa328a890e9287428f04de544dc5'
          }
          foreach ($name in $expected.Keys) {
            $actual = (Get-FileHash "old/$name" -Algorithm SHA256).Hash.ToLower()
            if ($actual -ne $expected[$name]) { throw "Unexpected $($name): $actual" }
          }

      - name: Install LynShen 0.5.1, then update it as users do
        shell: pwsh
        env:
          ONLY: ${{ inputs.scenarios }}
        run: |
          $check = @{
            OldSetup = "old/LynShen_${env:OLD_VERSION}_x64-setup.exe"
            OldMsi = "old/LynShen_${env:OLD_VERSION}_x64_en-US.msi"
            NewSetup = "new/Aogiri_${env:NEW_VERSION}_x64-setup.exe"
            NewSetupSig = "new/Aogiri_${env:NEW_VERSION}_x64-setup.exe.sig"
            NewMsi = "new/Aogiri_${env:NEW_VERSION}_x64_en-US.msi"
            NewMsiSig = "new/Aogiri_${env:NEW_VERSION}_x64_en-US.msi.sig"
            NewVersion = $env:NEW_VERSION
          }
          if (Test-Path new/updater.pub) { $check.UpdaterPubkey = Get-Content new/updater.pub -Raw }
          if (Test-Path mid) { $check.MidSetup = "mid/Aogiri_${env:MID_VERSION}_x64-setup.exe" }
          if ($env:ONLY) { $check.Only = $env:ONLY -split ',' }
          ./scripts/windows-rename-upgrade-check.ps1 @check

      - name: Keep the test installers
        if: always() && env.NEW_TAG == ''
        uses: actions/upload-artifact@v4
        with:
          name: rename-test-installers-windows
          path: |
            new/*.exe
            new/*.msi
          retention-days: 7
          if-no-files-found: ignore

  macos:
    name: macOS (LynShen.app 0.5.1 updated in place, Aogiri.app beside it)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        if: env.NEW_TAG == ''
      - uses: actions/setup-node@v4
        if: env.NEW_TAG == ''
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        if: env.NEW_TAG == ''
      - uses: Swatinem/rust-cache@v2
        if: env.NEW_TAG == ''
        with:
          workspaces: src-tauri
          cache-on-failure: true
      - run: pnpm install --frozen-lockfile
        if: env.NEW_TAG == ''

      - name: Stand in for the engine sidecar
        if: env.NEW_TAG == ''
        run: |
          mkdir -p src-tauri/binaries
          cp /usr/bin/true src-tauri/binaries/lynshen-cli-aarch64-apple-darwin

      # Ad-hoc signed, as a release without the signing certificate is.
      - name: Build the app from this branch
        if: env.NEW_TAG == ''
        env:
          APPLE_SIGNING_IDENTITY: '-'
        run: |
          printf '{"version":"%s","bundle":{"createUpdaterArtifacts":false,"targets":["app"]}}' "$TEST_VERSION" > rename-test.conf.json
          pnpm tauri build --config src-tauri/tauri.bundle.conf.json --config rename-test.conf.json
          mkdir -p new
          # The archive the updater downloads: Aogiri.app at its top.
          tar -czf new/Aogiri.app.tar.gz -C src-tauri/target/release/bundle/macos Aogiri.app
          echo "NEW_VERSION=$TEST_VERSION" >> "$GITHUB_ENV"

      - name: Download the published release's app archive
        if: env.NEW_TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$NEW_TAG" --repo Libra1337/LynShen_Agent --dir new --pattern 'Aogiri_aarch64.app.tar.gz'
          mv new/Aogiri_aarch64.app.tar.gz new/Aogiri.app.tar.gz
          echo "NEW_VERSION=${NEW_TAG#v}" >> "$GITHUB_ENV"

      - name: Download the released LynShen 0.5.1 dmg and Aogiri 0.6.0 update
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$OLD_TAG" --repo Libra1337/LynShen_Agent --dir old --pattern "LynShen_${OLD_VERSION}_aarch64.dmg"
          if [ -z "$NEW_TAG" ]; then
            gh release download "$MID_TAG" --repo Libra1337/LynShen_Agent --dir mid --pattern 'Aogiri_aarch64.app.tar.gz'
          fi
          # The file the release and the download server publish.
          echo "5b9fc27a9fe69d0836994197307da5395c412591c9ea008927608f7ecc27e921  old/LynShen_${OLD_VERSION}_aarch64.dmg" | shasum -a 256 -c

      - name: Install LynShen 0.5.1, then update it as users do
        env:
          RENAME_CHECK_THROWAWAY: '1'
        run: |
          mid=""; [ -f mid/Aogiri_aarch64.app.tar.gz ] && mid=mid/Aogiri_aarch64.app.tar.gz
          scripts/macos-rename-upgrade-check.sh "old/LynShen_${OLD_VERSION}_aarch64.dmg" new/Aogiri.app.tar.gz "$NEW_VERSION" $mid

  linux:
    name: Linux (deb and rpm over LynShen 0.5.1)
    if: inputs.new_release_tag == ''
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev \
            build-essential file libssl-dev
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true
      - run: pnpm install --frozen-lockfile

      - name: Stand in for the engine sidecar
        run: |
          mkdir -p src-tauri/binaries
          cp /bin/true src-tauri/binaries/lynshen-cli-x86_64-unknown-linux-gnu

      - name: Build the packages from this branch
        run: |
          printf '{"version":"%s","bundle":{"createUpdaterArtifacts":false,"targets":["deb","rpm"]}}' "$TEST_VERSION" > rename-test.conf.json
          pnpm tauri build --config src-tauri/tauri.bundle.conf.json --config rename-test.conf.json
          find src-tauri/target/release/bundle -type f

      - name: Download the released LynShen 0.5.1 packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$OLD_TAG" --repo Libra1337/LynShen_Agent --dir old \
            --pattern "LynShen_${OLD_VERSION}_amd64.deb" --pattern "LynShen-${OLD_VERSION}-1.x86_64.rpm"
          # The files the release and the download server publish.
          sha256sum --check <<EOF
          11ae94baef3dcf45ab5e53c48f591a9bdc3518028ea33c821386996f27b44c22  old/LynShen_${OLD_VERSION}_amd64.deb
          a359051afd4437b6f2d6f72d6b22e4a618447d01b2c2129141dba9a734f53143  old/LynShen-${OLD_VERSION}-1.x86_64.rpm
          EOF

      - name: Show what the new packages declare
        run: |
          dpkg-deb --info "src-tauri/target/release/bundle/deb/Aogiri_${TEST_VERSION}_amd64.deb"
          dpkg-deb --contents "src-tauri/target/release/bundle/deb/Aogiri_${TEST_VERSION}_amd64.deb"

      - name: 'deb: install LynShen 0.5.1, then update it as the updater does'
        run: |
          cp "src-tauri/target/release/bundle/deb/Aogiri_${TEST_VERSION}_amd64.deb" .
          cp "old/LynShen_${OLD_VERSION}_amd64.deb" .
          scripts/linux-rename-upgrade-check.sh deb "LynShen_${OLD_VERSION}_amd64.deb" "Aogiri_${TEST_VERSION}_amd64.deb"

      - name: 'rpm: the same in a Fedora container'
        run: |
          mkdir rpm-test
          cp "old/LynShen-${OLD_VERSION}-1.x86_64.rpm" "src-tauri/target/release/bundle/rpm/Aogiri-${TEST_VERSION}-1.x86_64.rpm" rpm-test/
          cp scripts/linux-rename-upgrade-check.sh rpm-test/
          docker run --rm -v "$PWD/rpm-test:/work" -w /work fedora:41 \
            bash linux-rename-upgrade-check.sh rpm "LynShen-${OLD_VERSION}-1.x86_64.rpm" "Aogiri-${TEST_VERSION}-1.x86_64.rpm"

      - name: Keep the test packages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rename-test-packages-linux
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
          retention-days: 7
          if-no-files-found: ignore
