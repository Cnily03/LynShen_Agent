# Standalone workspace so the desktop app stays out of the CLI's cargo workspace.
[workspace]

[package]
name = "desktop"
version = "0.10.1"
description = "Aogiri desktop app"
authors = ["LynShen Innovations INC."]
license = "Apache-2.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# The executable is named after the product: macOS shows an unbundled binary's
# file name in the Dock (`tauri dev`), and the bundles use it as the main
# binary. It was `LynShen` up to 0.5.x; what an upgrade from that name needs is
# in docs/rename-aogiri-notes.md (Windows: src-tauri/windows/hooks.nsh).
[[bin]]
name = "Aogiri"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "protocol-asset", "tray-icon"] }
base64 = "0.22"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-window-state = "2"
tauri-plugin-deep-link = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.8"
ureq = { version = "2", features = ["json"] }
sha2 = "0.10"
# auth.json 凭据静态加密（见 docs/secrets.md）。纯 Rust、无 C 依赖，
# default-features 关掉以免多带一份 std/stream 支持。
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc", "getrandom"] }
getrandom = "0.2"
tauri-plugin-clipboard-manager = "2"
# 一键导入：读 opencode / zcode 的会话库（只读）和 Codex 的 config.toml。
# bundled 自带 SQLite，不依赖系统库。
rusqlite = { version = "0.32", features = ["bundled"] }
toml = "0.8"
# Import: DeepSeek Harness (DSH) keeps its conversation logs as Zstandard
# frames (read only). Pure Rust, no C toolchain. Without `hash`: the frame
# checksums are not verified, and a damaged frame still fails to decode.
ruzstd = { version = "0.9", default-features = false, features = ["std"] }

# 仅桌面端的插件（updater / 单实例 / 进程重启 / 开机自启）
[target."cfg(not(any(target_os = \"android\", target_os = \"ios\")))".dependencies]
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-autostart = "2"
# The paths of files copied in Explorer / Finder / a Linux file manager
# (attachments.rs). Already in the tree through tauri-plugin-clipboard-manager,
# whose own clipboard handle is private.
arboard = { version = "3", default-features = false }

# macOS 侧栏磨砂（NSVisualEffectView）。macOSPrivateApi 在 tauri.conf.json 里对所有平台开启
# （非 macOS 上不起作用），和共用依赖里的 macos-private-api feature 保持一致：tauri dev 会按
# 配置自动改写 feature，两边只在 macOS 开时，它会把 feature 写进共用依赖，导致 Linux/Windows
# 构建报错。
[target."cfg(any(target_os = \"macos\", target_os = \"windows\"))".dependencies]
# 窗口磨砂（默认关闭，见 src/main_window.rs）：macOS 的 NSVisualEffectView，Windows 11 的
# Mica。macOS 的窗口始终透明（tauri.macos.conf.json），Windows 只在打开磨砂时透明；
# Linux 没有通用的模糊接口，保持不透明。
window-vibrancy = "0.5"

[target."cfg(target_os = \"windows\")".dependencies]
# Mica 只有 Windows 11（build 22000 起）才有：创建窗口之前要先知道系统版本。
windows-version = "0.1"
# 改名前注册在 Run 键里的开机自启项，启动时挪到新名字下（src/renamed.rs）。
# 与 auto-launch 用的是同一个版本，不多带一份。
winreg = "0.10"
# The trial plan's device hash reads MachineGuid (device_id.rs). Already in
# Cargo.lock through hyper-util's Windows proxy lookup.
windows-registry = "0.6"
# Shortcuts left from before the rename (src/renamed/shortcuts.rs): .lnk files
# and known folders. The version and features tao already uses.
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_UI_Shell"] }

[target."cfg(target_os = \"macos\")".dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSImage", "NSResponder"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSData", "NSError", "NSFileManager", "NSString", "NSURL"] }
# The identifier and version of an old LynShen.app (src/renamed/bundle.rs).
# Already in Cargo.lock through Tauri.
plist = "1"
